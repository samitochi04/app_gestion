<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row-3">
    <app-form-field label="Fournisseur" [required]="true"
      [error]="submitted() && form.controls.supplierId.invalid ? 'Fournisseur requis.' : ''">
      <app-select [options]="supplierOptions()" formControlName="supplierId" placeholder="Choisir..." />
    </app-form-field>
    <app-form-field label="Date d’émission">
      <app-date-input formControlName="issueDate" />
    </app-form-field>
    <app-form-field label="Échéance">
      <app-date-input formControlName="dueDate" />
    </app-form-field>
  </div>

  <p class="t-micro mv-lines-title">Lignes</p>
  <p class="t-caption mv-hint">
    <strong>Produit</strong>, <strong>Quantité</strong>, <strong>Prix unitaire</strong>, <strong>TVA %</strong>,
    <strong>Nature</strong> (marchandise → compte de stock 31x, prestation → compte de charge 6xx).
  </p>
  <div formArrayName="lines" class="mv-lines">
    @for (line of lines.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="mv-line mv-line--receive">
        <app-select [options]="productOptions()" formControlName="productId" placeholder="Produit" />
        <app-text-input type="number" formControlName="quantity" placeholder="Qté" />
        <app-text-input type="number" formControlName="unitPrice" placeholder="Prix unitaire" />
        <app-text-input type="number" formControlName="vatRate" placeholder="TVA %" />
        <app-select [options]="natures" formControlName="nature" />
        <button type="button" class="mv-line__remove" (click)="removeLine(i)" aria-label="Retirer la ligne">
          <app-icon name="x" [size]="16" />
        </button>
      </div>
    }
  </div>
  <button type="button" class="mv-add-line" (click)="addLine()">+ Ajouter une ligne</button>

  <app-form-field label="Notes">
    <app-text-input formControlName="notes" />
  </app-form-field>

  <div class="form-actions">
    <app-button type="submit" [loading]="saving()">Créer la facture</app-button>
  </div>
</form>
