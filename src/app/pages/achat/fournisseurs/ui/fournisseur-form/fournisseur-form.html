<form [formGroup]="form" (ngSubmit)="submit()">
  <app-form-field label="Nom" [required]="true"
    [error]="submitted() && form.controls.name.invalid ? 'Le nom est requis.' : ''">
    <app-text-input formControlName="name" />
  </app-form-field>
  <div class="row-2">
    <app-form-field label="E-mail"
      [error]="submitted() && form.controls.email.invalid ? 'E-mail invalide.' : ''">
      <app-text-input type="email" formControlName="email" />
    </app-form-field>
    <app-form-field label="Téléphone">
      <app-text-input formControlName="phone" />
    </app-form-field>
  </div>
  <div class="row-2">
    <app-form-field label="Identifiant fiscal">
      <app-text-input formControlName="taxId" />
    </app-form-field>
    <app-form-field label="Adresse">
      <app-text-input formControlName="address" />
    </app-form-field>
  </div>
  <div class="form-actions">
    <app-button type="submit" [loading]="saving()">{{ isEdit ? 'Enregistrer' : 'Créer' }}</app-button>
  </div>
</form>
