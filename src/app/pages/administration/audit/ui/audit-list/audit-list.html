<app-page-header title="Audit" description="Historique des actions effectuées dans le système.">
  <app-search-input (changed)="onSearch($event)" />
  <app-button variant="secondary" (pressed)="openFilters()">
    <app-icon name="filter" [size]="16" />
    Filtres@if (activeFilterCount() > 0) { <span> ({{ activeFilterCount() }})</span> }
  </app-button>
</app-page-header>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns" [rows]="entries()" [loading]="loading()"
      [searchTerm]="search()"
      emptyTitle="Aucune activité enregistrée"
      [showActions]="false"
      [canView]="true"
      (view)="viewDetail($event)"
    />
  </div>
  <div class="table-footer">
    <app-paginator
      [page]="page()" [size]="size()" [totalElements]="totalElements()" [totalPages]="totalPages()"
      (pageChange)="load($event)"
    />
  </div>
</app-card>
