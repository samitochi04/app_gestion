<app-page-header title="Utilisateurs" description="Comptes et rôles assignés.">
  <app-search-input (changed)="searchTerm.set($event)" />
  <app-button (pressed)="create()">+ Nouveau compte</app-button>
</app-page-header>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns" [rows]="users()" [loading]="loading()"
      [searchTerm]="searchTerm()" [actions]="actions"
      emptyTitle="Aucun utilisateur" [canView]="false" [canDelete]="false"
      (edit)="assignRole($event)"
    />
  </div>
  <div class="table-footer">
    <app-paginator
      [page]="page()" [size]="size()" [totalElements]="totalElements()" [totalPages]="totalPages()"
      (pageChange)="load($event)"
    />
  </div>
</app-card>
