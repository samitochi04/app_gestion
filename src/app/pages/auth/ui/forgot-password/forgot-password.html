<div class="auth">
  <div class="auth__panel">
    <div class="auth__brand">
      <span class="auth__logo">K</span>
      <p class="t-h2">KIT · Gestion</p>
    </div>

    <h1 class="t-h1 auth__title">Mot de passe oublié</h1>
    <p class="t-caption auth__subtitle">
      Saisissez votre e-mail, nous vous enverrons un code de réinitialisation.
    </p>

    @if (!sent()) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
        <app-form-field label="E-mail" [required]="true"
          [error]="submitted() && form.controls.email.invalid ? 'Veuillez saisir un e-mail valide.' : ''">
          <app-text-input type="email" placeholder="jean.dupont@entreprise.com" formControlName="email" />
        </app-form-field>
        <app-button type="submit" class="auth__submit">Envoyer le code</app-button>
      </form>
    } @else {
      <p class="t-body">
        Si un compte existe pour cette adresse, un code de réinitialisation a été envoyé.
      </p>
      <app-button class="auth__submit" (pressed)="goToReset()">J’ai reçu mon code</app-button>
    }

    <p class="t-caption auth__footer">
      <a routerLink="/login">Retour à la connexion</a>
    </p>
  </div>
</div>
