<div class="auth">
  <div class="auth__panel">
    <div class="auth__brand">
      <span class="auth__logo">K</span>
      <p class="t-h2">KIT · Gestion</p>
    </div>

    <h1 class="t-h1 auth__title">Réinitialiser le mot de passe</h1>
    <p class="t-caption auth__subtitle">Saisissez le code reçu et votre nouveau mot de passe.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth__form">
      <app-form-field label="E-mail" [required]="true">
        <app-text-input type="email" formControlName="email" />
      </app-form-field>

      <app-form-field label="Code de réinitialisation" [required]="true"
        [error]="submitted() && form.controls.code.invalid ? 'Le code est requis.' : ''">
        <app-text-input placeholder="123456" formControlName="code" />
      </app-form-field>

      <app-form-field label="Nouveau mot de passe" [required]="true"
        [error]="submitted() && form.controls.newPassword.invalid ? 'Au moins 8 caractères.' : ''">
        <app-text-input type="password" autocomplete="new-password" formControlName="newPassword" />
      </app-form-field>

      <app-button type="submit" class="auth__submit">Réinitialiser</app-button>
    </form>

    <p class="t-caption auth__footer">
      <a routerLink="/login">Retour à la connexion</a>
    </p>
  </div>
</div>
