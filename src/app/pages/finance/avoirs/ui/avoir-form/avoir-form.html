<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row-2">
    <app-form-field label="Facture" [required]="true">
      <app-select [options]="invoiceOptions()" formControlName="invoiceId" placeholder="Choisir..." />
    </app-form-field>
    <app-form-field label="Type" [required]="true">
      <app-select [options]="types" formControlName="type" />
    </app-form-field>
  </div>
  <app-form-field label="Motif" [required]="true"
    [error]="submitted() && form.controls.reason.invalid ? 'Le motif est requis.' : ''">
    <app-text-input formControlName="reason" />
  </app-form-field>

  <p class="t-micro mv-lines-title">Lignes à créditer</p>
  <div formArrayName="lines" class="mv-lines">
    @for (line of lines.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="mv-line">
        <app-select [options]="productOptions()" formControlName="productId" placeholder="Produit" />
        <app-text-input type="number" formControlName="quantity" placeholder="Qté" />
        <app-text-input type="number" formControlName="unitPrice" placeholder="Prix" />
        <button type="button" class="mv-line__remove" (click)="removeLine(i)" aria-label="Retirer la ligne">
          <app-icon name="x" [size]="16" />
        </button>
      </div>
    }
  </div>
  <button type="button" class="mv-add-line" (click)="addLine()">+ Ajouter une ligne</button>

  <div class="form-actions">
    <app-button type="submit" [loading]="saving()">Créer l’avoir</app-button>
  </div>
</form>
