<p class="t-caption pay-remaining">Restant dû : {{ money(data.invoice.remainingAmount) }}</p>
<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="row-2">
    <app-form-field label="Montant" [required]="true"
      [error]="submitted() && form.controls.amount.invalid ? 'Montant invalide.' : ''">
      <app-text-input type="number" formControlName="amount" />
    </app-form-field>
    <app-form-field label="Mode de paiement" [required]="true">
      <app-select [options]="methods" formControlName="method" />
    </app-form-field>
  </div>
  <app-form-field label="Référence">
    <app-text-input formControlName="reference" />
  </app-form-field>
  <app-form-field label="Notes">
    <app-text-input formControlName="notes" />
  </app-form-field>
  <div class="form-actions">
    <app-button type="submit">Enregistrer le paiement</app-button>
  </div>
</form>
