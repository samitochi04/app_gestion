<app-page-header title="Paiements" description="Encaissements par facture." />

<app-card>
  <app-form-field label="Filtrer par facture">
    <app-select
      [options]="invoiceOptions()"
      [ngModel]="selectedInvoiceId()"
      (ngModelChange)="onSelectInvoice($event)"
      placeholder="Toutes les factures"
    />
  </app-form-field>
</app-card>

<div class="paiements-spacer"></div>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns" [rows]="payments()" [loading]="loading()"
      emptyTitle="Aucun paiement enregistré"
      emptyMessage="Aucun paiement n'a encore été enregistré."
      [showActions]="false"
    />
  </div>
  @if (selectedInvoiceId() != null) {
    <div class="table-footer">
      <app-button (pressed)="recordPayment()">+ Enregistrer un paiement</app-button>
    </div>
  }
</app-card>
