<app-page-header title="Catégories" description="Classification des produits.">
  <app-search-input (changed)="searchTerm.set($event)" />
  <app-button (pressed)="create()">+ Nouveau</app-button>
</app-page-header>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns" [rows]="categories()" [loading]="loading()"
      [searchTerm]="searchTerm()"
      emptyTitle="Aucune catégorie" [canView]="false"
      (edit)="edit($event)" (delete)="remove($event)"
    />
  </div>
</app-card>
