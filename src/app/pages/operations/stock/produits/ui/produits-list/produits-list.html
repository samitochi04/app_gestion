<app-page-header title="Produits" description="Catalogue des articles gérés en stock.">
  <app-search-input (changed)="onSearch($event)" />
  <app-button variant="secondary" (pressed)="openFilters()">
    <app-icon name="filter" [size]="16" />
    Filtres@if (activeFilterCount() > 0) { <span> ({{ activeFilterCount() }})</span> }
  </app-button>
  <app-button (pressed)="create()">+ Nouveau</app-button>
</app-page-header>

<app-alert-banner
  [tone]="outOfStockCount() > 0 ? 'danger' : stockBannerTone()"
  [title]="outOfStockCount() > 0
    ? outOfStockCount() + ' produit(s) en rupture de stock'
    : stockAlerts().length > 0
      ? stockAlerts().length + ' produit(s) nécessitent votre attention'
      : 'Niveaux de stock normaux'"
  [message]="outOfStockCount() > 0
    ? 'Ces produits n\'ont plus de stock disponible. Pensez à passer une commande d\'achat.'
    : stockAlerts().length > 0
      ? 'Consultez Opérations > Mouvements > Stock actuel pour le détail.'
      : 'Aucune rupture ni alerte de stock bas actuellement.'"
/>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns"
      [rows]="products()"
      [loading]="loading()"
      [searchTerm]="searchTerm()"
      [highlightId]="flashId()"
      emptyTitle="Aucun produit"
      emptyMessage="Créez votre premier produit pour commencer."
      (view)="view($event)"
      (edit)="edit($event)"
      (delete)="remove($event)"
      [canView]="true"
    />
  </div>
  <div class="table-footer">
    <app-paginator
      [page]="page()" [size]="size()" [totalElements]="totalElements()" [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />
  </div>
</app-card>
