<app-page-header title="Livraisons" description="Commandes en cours d’acheminement." />

<app-alert-banner
  tone="info"
  title="Comment fonctionnent les livraisons"
  message="Cette vue liste les commandes confirmées. Créez une commande, confirmez-la (réservation du stock), puis faites-la avancer ici : Préparer → Expédier → Livrer. L’expédition génère automatiquement la facture brouillon."
/>

<app-card [padded]="false">
  <div class="table-container">
    <app-data-table
      [columns]="columns" [rows]="orders()" [loading]="loading()"
      [actions]="actions"
      emptyTitle="Aucune livraison en cours"
      emptyMessage="Confirmez une commande pour la voir apparaître ici."
      [canDelete]="false" [canView]="true"
      (view)="view($event)"
      (edit)="edit($event)"
    />
  </div>
</app-card>
