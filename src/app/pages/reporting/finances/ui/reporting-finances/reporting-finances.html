<app-page-header title="Reporting — Finances" description="Vue consolidée de la performance financière et états OHADA." />

@if (loading()) {
  <app-loading-skeleton [count]="4" [rowHeight]="90" />
} @else if (error()) {
  <app-error-state title="Impossible de charger le reporting financier"
                    message="Le serveur n’a pas pu répondre. Réessayez."
                    (retry)="load()" />
} @else if (data(); as d) {
  <div class="rep-kpis">
    <app-kpi-card label="Chiffre d’affaires" [value]="currency(d.totalRevenue)" />
    <app-kpi-card label="Charges" [value]="currency(d.totalCharges)" />
    <app-kpi-card label="Résultat net" [value]="currency(d.netResult)" />
    <app-kpi-card label="Créances en retard" [value]="currency(d.overdueReceivables)" [invert]="true" />
  </div>

  @if (revenueSeries()[0]?.series?.length) {
    <app-card class="rep-chart">
      <p class="t-h3 rep-chart-title">Chiffre d’affaires vs encaissements</p>
      <app-line-chart [data]="revenueSeries()" [height]="300" />
    </app-card>
  }
}

<app-card class="rep-exports">
  <p class="t-h3 rep-chart-title">États et exports</p>
  <p class="t-caption">Bilan, compte de résultat, balances et journaux, sur la période choisie.</p>
  <div class="rep-export-row">
    <app-form-field label="Document">
      <app-select [options]="documentOptions" [ngModel]="document()" (ngModelChange)="document.set($event)" />
    </app-form-field>
    <app-form-field label="Du">
      <app-date-input [ngModel]="from()" (ngModelChange)="from.set($event)" />
    </app-form-field>
    <app-form-field label="Au">
      <app-date-input [ngModel]="to()" (ngModelChange)="to.set($event)" />
    </app-form-field>
    <app-form-field label="Format">
      <app-select [options]="formatOptions" [ngModel]="format()" (ngModelChange)="format.set($event)" />
    </app-form-field>
    <app-button [loading]="exporting()" (pressed)="downloadDocument()">Télécharger</app-button>
  </div>
</app-card>
