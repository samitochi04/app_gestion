<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Réinitialiser le mot de passe</h1>
      <p>Entrez votre email pour recevoir un code OTP</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-error">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">
        {{ successMessage() }}
      </div>
    }

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="votre@email.com"
          [class.input-error]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched"
        />
        @if (resetForm.get('email')?.invalid && resetForm.get('email')?.touched) {
          <span class="field-error">Email invalide</span>
        }
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="resetForm.invalid || loading()">
        @if (loading()) {
          <span class="spinner"></span> Envoi...
        } @else {
          Envoyer le code OTP
        }
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Retour à la connexion</a>
    </div>
  </div>
</div>
